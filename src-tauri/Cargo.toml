[package]
name = "darric"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "darric_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Persistence
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
rusqlite_migration = "1"

# Audio capture
cpal = "0.15"

# Transcription
whisper-rs = { version = "0.16", features = ["metal"] }

# Model download
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
futures-util = "0.3"
sha2 = "0.10"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# MCP server (read-only, loopback). rmcp validates the Host header by default,
# which is the DNS-rebinding floor the 2026-05-19 decision requires.
rmcp = { version = "3.2", default-features = false, features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = "1.0"
axum = "0.8"


# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
objc2-core-audio = { version = "0.3.2", features = ["AudioHardware"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-core-audio-types = "0.3.2"

[dev-dependencies]
rmcp = { version = "3.2", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
# rmcp's streamable-HTTP client is implemented for reqwest 0.13; the app's model
# downloader is on 0.12. Only the protocol round-trip test needs this one.
reqwest13 = { package = "reqwest", version = "0.13", default-features = false }

[lints.rust]
missing_docs = "allow"
missing_debug_implementations = "allow"
unreachable_pub = "allow"
unused_import_braces = "warn"
unused_qualifications = "warn"
unsafe_op_in_unsafe_fn = "deny"
let_underscore_drop = "deny"
unused_must_use = "deny"

[lints.clippy]
# Tier 1: errors (bugs and correctness)
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
# Tier 2: warnings (style and pedantic)
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Tier 3: dependency hygiene
cargo = { level = "warn", priority = -1 }

# Overrides for legitimate Tauri patterns
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
significant_drop_tightening = "allow"
await_holding_lock = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
multiple_crate_versions = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
cargo_common_metadata = "allow"

