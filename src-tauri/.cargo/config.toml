[build]
rustflags = [
  "-W", "unused-extern-crates",
  "-W", "future-incompatible",
]

# Every build of this crate -- local, check.yml, and the release workflow --
# compiles whisper.cpp's ggml the same way. See cmake/portable-cpu.cmake for
# what it does and why it has to be a toolchain file.
#
# `relative = true` resolves the path against the parent of this .cargo
# directory (src-tauri/), so it works from any working directory and needs no
# absolute path baked into CI. Cargo does not override an existing value, so a
# developer can still opt out for a one-off native build by setting
# CMAKE_TOOLCHAIN_FILE themselves.
[env]
CMAKE_TOOLCHAIN_FILE = { value = "cmake/portable-cpu.cmake", relative = true }
