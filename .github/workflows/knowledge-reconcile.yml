name: Reconcile Knowledge

# minerva:promote is add-only: on a work-unit branch it writes new
# .minerva/knowledge/<date>-<type>-<slug>.md entries and touches no aggregate.
# That is what keeps concurrent minerva PRs conflict-free -- a branch's
# .minerva/ footprint is purely additions, and new files always merge cleanly.
#
# The deferred half (index.md catalog lines, the watermark, reciprocal
# ## Related links, supersession banners) is written here, on the default
# branch, where there is exactly one writer at a time.
#
# IMPORTANT: installing this workflow makes `minerva:cleanup` stand down from
# reconciliation -- it greps .github/workflows/ for `knowledge_fix.py` and skips
# its own pass when it finds one, because two unserialised writers would both
# open PRs editing index.md. Two consequences:
#   * reconciliation now happens on merge, without anyone running cleanup;
#   * overview.md is NOT refreshed here. Synthesis is a judgment call, not a
#     deterministic rewrite, so it stays with `minerva:synthesize` -- run it by
#     hand when `synthesis_status` reports un-synthesized entries.
#
# The PR this opens merges itself. It is derived content -- regenerated by a
# pinned script, with nothing for a reviewer to judge -- so the job lints the
# result and merges it rather than waiting on a human.
#
# GITHUB_TOKEN is what shapes the rest of this file. GitHub runs no workflow for
# a pull request opened with it, and none for a push it makes, so a
# reconciliation PR gets zero checks and its merge does not re-trigger check.yml
# on main. check.yml's `Knowledge Wiki` job therefore never sees this PR, though
# it does run on every other one; the linting this job does itself is standing in
# for that, before the merge and again after it.

on:
  push:
    branches: [main]
    paths:
      - ".minerva/knowledge/**"
  workflow_dispatch:

# One reconciler at a time. Do not cancel in progress: a cancelled run can leave
# a pushed branch with no PR opened for it.
concurrency:
  group: knowledge-reconcile
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    name: Reconcile index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out minerva tooling
        uses: actions/checkout@v4
        with:
          repository: honerlaw/agent-marketplace
          path: .minerva-tools
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Lint errors already on main are not this reconciliation's fault, and the
      # fixer cannot clear them: it refuses broken [[...]] links and duplicate
      # ids by design, and both are error-severity. Gating on them would let one
      # inherited defect wedge every future reconciliation. Record them first so
      # the gate below can fail on new errors only. A crash here leaves an empty
      # baseline, which can only make that gate stricter, never looser.
      - name: Baseline knowledge lint
        run: |
          # +e explicitly: the runner's default shell already has errexit set,
          # and `set -uo pipefail` does not clear it. Nothing in this step may
          # fail the run -- an unusable baseline is survivable, a red job is not.
          set +e
          set -uo pipefail
          python .minerva-tools/plugins/minerva/scripts/knowledge_lint.py .minerva/knowledge \
            > "${RUNNER_TEMP}/lint-baseline.log" 2>&1
          grep '  error:' "${RUNNER_TEMP}/lint-baseline.log" | sort \
            > "${RUNNER_TEMP}/errors-baseline.txt"
          if [ -s "${RUNNER_TEMP}/errors-baseline.txt" ]; then
            echo "::warning::main's knowledge corpus already has lint errors. They are listed in this step's log and will not block reconciliation."
            cat "${RUNNER_TEMP}/errors-baseline.txt"
          fi
          exit 0

      - name: Apply mechanical fixes
        run: python .minerva-tools/plugins/minerva/scripts/knowledge_fix.py .minerva/knowledge

      - name: Open a reconciliation PR and merge it, if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # .minerva-tools is an untracked checkout path -- scope to the corpus.
          if git diff --quiet -- .minerva/knowledge; then
            echo "reconciliation: nothing pending"
            exit 0
          fi

          # Both ids: GITHUB_RUN_ID is stable across "Re-run failed jobs", so a
          # re-run would otherwise reuse the branch of the attempt that failed --
          # pushing to a ref whose commit main already carries, or racing a
          # deleted one. The attempt number is what makes the ref actually unique.
          BRANCH="minerva/reconcile-ci/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add .minerva/knowledge
          git commit -m "chore: reconcile knowledge index"
          # Never --force: a non-forced push to a run-unique ref cannot clobber
          # another run's branch.
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "chore: reconcile knowledge index" \
            --body "$(printf '%s\n' \
              'Derived content, regenerated from the corpus by `knowledge_fix.py` -- no authored judgment to review.' \
              '' \
              'Adds catalog lines from each entry'"'"'s `**Summary**`, bumps the watermark, writes missing reciprocal `## Related` links and supersession banners, and relocates wrong-Type lines.' \
              '' \
              "Triggered by ${GITHUB_SHA}.")")

          # This PR is the only one that rewrites index.md -- the file the
          # linter's index-drift error exists to protect -- and the only one
          # check.yml cannot see. Stand in for that gate here, before merging it
          # unreviewed, scoped to errors THIS reconciliation introduced.
          # Stdout is the result channel -- it is captured by the caller, so it
          # carries the new error lines and nothing else. Diagnostics go to
          # stderr, and ::error:: annotations are left to the callers, which know
          # whether the merge has happened yet. Stage files are namespaced away
          # from errors-baseline.txt: a stage that overwrote the baseline would
          # compare it against itself and pass unconditionally.
          new_lint_errors() {   # $1: stage label. Prints new error lines, if any.
            local rc=0
            python .minerva-tools/plugins/minerva/scripts/knowledge_lint.py .minerva/knowledge \
              > "${RUNNER_TEMP}/lint-stage-$1.log" 2>&1 || rc=$?
            cat "${RUNNER_TEMP}/lint-stage-$1.log" >&2
            if [ "$rc" -gt 1 ]; then
              echo "knowledge_lint.py exited ${rc} at stage '$1' -- a crash, not a lint failure." >&2
              return 2
            fi
            grep '  error:' "${RUNNER_TEMP}/lint-stage-$1.log" | sort \
              > "${RUNNER_TEMP}/errors-stage-$1.txt" || true
            comm -13 "${RUNNER_TEMP}/errors-baseline.txt" "${RUNNER_TEMP}/errors-stage-$1.txt"
          }

          if ! NEW_ERRORS=$(new_lint_errors after-fix); then
            echo "::error::knowledge_lint.py crashed at the pre-merge gate. ${PR_URL} is open and unmerged."
            exit 1
          fi
          if [ -n "$NEW_ERRORS" ]; then
            printf '%s\n' "$NEW_ERRORS"
            echo "::error::this reconciliation introduced knowledge-lint errors. ${PR_URL} is open and unmerged -- fix the corpus, or review and merge it by hand."
            exit 1
          fi

          # A direct merge, deliberately not `gh pr merge --auto`. These PRs
          # carry no checks by construction, so a required status check added to
          # main would leave one "waiting for status to be reported" forever --
          # and --auto *accepts* a blocked PR, so gh would exit 0, this job would
          # go green, and reconciliation would stop with nothing to notice it.
          # A direct merge that branch protection rejects fails the job instead.
          # $PR_URL, not $BRANCH: exact, and it skips gh's head-ref-to-PR lookup.
          gh pr merge --squash "$PR_URL"
          echo "reconciliation: ${PR_URL} -- merged"

          # The gate above saw the branch, not the merge result, and main may
          # have moved under it -- an unrelated PR deleting an entry this run
          # just catalogued lands as index drift. Normally check.yml's push
          # trigger would report that; a GITHUB_TOKEN merge fires no push event,
          # so re-run the linter here on what actually landed. This reports the
          # drift, it does not prevent it.
          #
          # The squash commit by oid, never main's tip: the tip can be a later,
          # unrelated merge -- which would blame this run for someone else's
          # defect -- or, from a lagging read, the pre-merge commit the baseline
          # was already taken on, which passes trivially and verifies nothing.
          # Fetching the oid explicitly also survives the shallow checkout.
          MERGE_SHA=$(gh pr view "$PR_URL" --json mergeCommit -q .mergeCommit.oid)
          if [ -z "$MERGE_SHA" ] || [ "$MERGE_SHA" = "null" ]; then
            echo "::error::${PR_URL} merged, but its squash commit oid could not be read, so post-merge verification did not run. The merge stands; run knowledge_lint.py against main by hand."
            exit 1
          fi
          git fetch --quiet --depth=1 origin "$MERGE_SHA"
          git checkout --quiet --detach "$MERGE_SHA"
          if ! NEW_ERRORS=$(new_lint_errors post-merge); then
            echo "::error::knowledge_lint.py crashed verifying ${MERGE_SHA}. ${PR_URL} DID merge -- this is a verification crash, not a merge failure. Do not re-run; investigate the corpus on main."
            exit 1
          fi
          if [ -n "$NEW_ERRORS" ]; then
            printf '%s\n' "$NEW_ERRORS"
            echo "::error::main has new knowledge-lint errors at ${MERGE_SHA}, after ${PR_URL} merged. The merge is done; the corpus needs a fix on main."
            exit 1
          fi
          echo "reconciliation: ${MERGE_SHA} verified -- no new lint errors"
