name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run typecheck:node
      - run: npm run lint
      - run: npm run format

  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

  rust:
    name: Rust
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # darric is a macOS app (README; whisper-rs is built with the `metal`
      # feature, which has no Linux equivalent). CI builds what ships.
      - name: Ensure cmake
        run: cmake --version || brew install cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm run lint:rust
      - run: npm run format:rust

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run test

  rust-test:
    name: Rust Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # darric is a macOS app (README; whisper-rs is built with the `metal`
      # feature, which has no Linux equivalent). CI builds what ships.
      - name: Ensure cmake
        run: cmake --version || brew install cmake

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo test --manifest-path src-tauri/Cargo.toml

  knowledge:
    name: Knowledge Wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out minerva tooling
        uses: actions/checkout@v4
        with:
          repository: honerlaw/agent-marketplace
          path: .minerva-tools
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Deterministic, read-only. Fails on index drift, broken [[...]] wikilinks
      # and missing reciprocals -- the defects that otherwise merge green.
      - name: Knowledge-wiki drift gate
        run: python .minerva-tools/plugins/minerva/scripts/knowledge_lint.py .minerva/knowledge
